# Furniture catalog.
# base-item: the vanilla item used as the carrier for the custom model
#            (PAPER is used for flat/held-friendly carriers; custom-model-data
#            on it is overridden by the resource pack's item model).
# model: path (without extension) to the Java model, under
#        assets/furnitureplugin/models/item/
# bedrock-geometry: identifier used in the Bedrock attachable file for this piece
# placement: FLOOR | WALL | TABLETOP
# size: approximate footprint in blocks, used for placement collision checks
# rotatable: whether players can cycle 4/8-step yaw with the rotate key

categories:
  CHRISTMAS:
    display-name: '&c&lChristmas'
    icon: PRESENT  # falls back to a vanilla icon in the GUI if not resolvable
